<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Вестник — ПРОБЕЛ</title>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
 
  <div class="archive-window">
 
    <div class="title-bar">
      <div class="title-bar-text">ПРОБЕЛ.EXE Ver. 1.0 — Вестник</div>
      <div class="title-bar-controls">
        <div class="retro-btn">_</div>
        <div class="retro-btn">□</div>
        <div class="retro-btn">x</div>
      </div>
    </div>
 
    <div class="radio-widget">
      <button class="radio-btn" id="radioToggle">▶</button>
      <span class="radio-track" id="radioTrackName">радиостанция офлайн</span>
      <audio id="bgPlayer" data-track-title="Название трека" loop>
        <!-- Позже пропиши свой файл:
        <source src="music/track1.mp3" type="audio/mpeg">
        -->
      </audio>
    </div>
 
    <div id="appContent">
 
      <div class="page-header">
        <div class="nav-links">
          <a href="index.html">главная</a>
          <a href="vestnik.html">вестник</a>
          <a href="#">архивы</a>
          <a href="#">библиотека</a>
          <a href="#">радиостанция</a>
          <a href="#">книга прибывших</a>
        </div>
      </div>
 
      <div class="vestnik-list" id="vestnikList">
        <div class="status-msg">Загружаю записи из архива...</div>
      </div>
 
      <script>
        const REPO = 'zaposhok1584/probel';
        const listEl = document.getElementById('vestnikList');
 
        function parsePost(raw) {
          const match = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n([\s\S]*)$/);
          if (!match) return { title: 'Без названия', date: '', body: raw };
          const frontmatter = match[1];
          const body = match[2];
          const titleMatch = frontmatter.match(/title:\s*(.*)/);
          const dateMatch = frontmatter.match(/date:\s*(.*)/);
          let title = titleMatch ? titleMatch[1].trim() : 'Без названия';
          title = title.replace(/^['"]|['"]$/g, '');
          const date = dateMatch ? dateMatch[1].trim() : '';
          return { title, date, body };
        }
 
        function formatDate(isoString) {
          if (!isoString) return '';
          const d = new Date(isoString);
          if (isNaN(d)) return isoString;
          return d.toLocaleDateString('ru-RU', { year: 'numeric', month: 'long', day: 'numeric' });
        }
 
        async function loadPosts() {
          try {
            const res = await fetch(`https://api.github.com/repos/${REPO}/contents/posts`);
            if (!res.ok) {
              listEl.innerHTML = '<div class="status-msg">Записей пока нет.</div>';
              return;
            }
            const files = await res.json();
            const mdFiles = files.filter(f => f.name.endsWith('.md'));
 
            if (mdFiles.length === 0) {
              listEl.innerHTML = '<div class="status-msg">Записей пока нет.</div>';
              return;
            }
 
            const posts = await Promise.all(mdFiles.map(async (file) => {
              const rawRes = await fetch(file.download_url);
              const rawText = await rawRes.text();
              return parsePost(rawText);
            }));
 
            posts.sort((a, b) => new Date(b.date) - new Date(a.date));
 
            listEl.innerHTML = posts.map(post => `
              <div class="post-entry">
                <h2 class="post-entry-title">${post.title}</h2>
                <div class="post-entry-date">${formatDate(post.date)}</div>
                <div class="post-entry-body">${marked.parse(post.body)}</div>
              </div>
            `).join('');
 
          } catch (err) {
            listEl.innerHTML = '<div class="status-msg">Не удалось загрузить записи. Попробуй обновить страницу.</div>';
          }
        }
 
        loadPosts();
      </script>
 
    </div>
 
  </div>
 
  <script src="app.js"></script>
 
</body>
</html>
